<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Gift Portfolio Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 24px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 24px;
    }

    .top-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 22px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
    }

    .stat-title {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.3;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
    }

    .chart-title {
      font-size: 18px;
      margin-bottom: 16px;
      color: #f8fafc;
    }

    .fund-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .fund-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 18px;
      border-radius: 18px;
      backdrop-filter: blur(12px);
    }

    .fund-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      color: #e2e8f0;
      font-size: 14px;
    }

    .allocation-bar {
      height: 10px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      margin-top: 12px;
      overflow: hidden;
    }

    .allocation-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      border-radius: 999px;
    }

    canvas {
      max-width: 100%;
    }

    @media(max-width: 900px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Gift Portfolio Dashboard</h1>

  <div class="top-grid">
    <div class="stat-card">
      <div class="stat-title">Total Portfolio</div>
      <div class="stat-value" id="totalValue">Loading...</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">Number of Funds</div>
      <div class="stat-value" id="fundCount">-</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">Largest Allocation</div>
      <div class="stat-value" id="largestFund">-</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">Last Updated</div>
      <div class="stat-value" id="todayDate">-</div>
    </div>
  </div>

  <div class="chart-grid">

    <div class="chart-card">
      <div class="chart-title">Portfolio Allocation</div>
      <canvas id="barChart"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-title">Asset Allocation</div>
      <canvas id="donutChart"></canvas>
    </div>

  </div>

  <div class="fund-grid" id="fundGrid"></div>

</div>

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/11rbwXYqXhJrXG7oWQS3pl5fHiXXWtNpsxgN7TbIc6UQ/gviz/tq?tqx=out:json";

function shortName(name) {
  return name
    .replace("UNITED GLOBAL DURABLE EQUITIES FUND M11UGD", "M11UGD")
    .replace("UNITED GLOBAL BALANCED FUND M10UGBF", "M10UGBF")
    .replace("UNITED GLOBAL INCOME STRATEGIC BOND FUND M12UGIS", "M12UGIS")
    .replace("UOB PERMPOONSUB (FIXED INCOME) M02FI", "M02FI")
    .replace("UOB SMART GOLD FUND M07SG", "M07SG")
    .replace("SCBRMWORLD(A)", "SCBRMWORLD");
}

function formatBaht(value) {
  return Number(value).toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + " THB";
}

function formatNumber(value) {
  return Number(value).toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 4
  });
}

async function loadData() {

  const res = await fetch(SHEET_URL);

  const text = await res.text();

  const jsonText = text.substring(
    text.indexOf("{"),
    text.lastIndexOf("}") + 1
  );

  const data = JSON.parse(jsonText);

  const rows = data.table.rows;

  const labels = [];
  const values = [];

  let totalPortfolio = 0;
  let largestFund = "";
  let largestValue = 0;

  const fundGrid =
    document.getElementById("fundGrid");

  fundGrid.innerHTML = "";

  rows.forEach(row => {

    const fund =
      row.c[0]?.v || "";

    const units =
      row.c[1]?.v || 0;

    const nav =
      row.c[2]?.v || 0;

    const totalValue =
      row.c[3]?.v || 0;

    const allocationText =
      row.c[4]?.f || "";

    const allocationValue =
      (row.c[4]?.v || 0) * 100;

    totalPortfolio += totalValue;

    if (totalValue > largestValue) {
      largestValue = totalValue;
      largestFund = fund;
    }

    labels.push(shortName(fund));
    values.push(totalValue);

    fundGrid.innerHTML += `
      <div class="fund-card">

        <div class="fund-name">
          ${shortName(fund)}
        </div>

        <div class="row">
          <span>Units</span>
          <strong>${formatNumber(units)}</strong>
        </div>

        <div class="row">
          <span>NAV</span>
          <strong>${formatNumber(nav)}</strong>
        </div>

        <div class="row">
          <span>Total Value</span>
          <strong>${formatBaht(totalValue)}</strong>
        </div>

        <div class="row">
          <span>Allocation</span>
          <strong>${allocationText}</strong>
        </div>

        <div class="allocation-bar">
          <div class="allocation-fill"
            style="width:${allocationValue}%">
          </div>
        </div>

      </div>
    `;
  });

  document.getElementById("totalValue")
    .innerHTML = formatBaht(totalPortfolio);

  document.getElementById("fundCount")
    .innerHTML = rows.length;

  document.getElementById("largestFund")
    .innerHTML = shortName(largestFund);

  document.getElementById("todayDate")
    .innerHTML = new Date().toLocaleDateString();

  new Chart(
    document.getElementById("barChart"),
    {
      type: "bar",

      data: {
        labels: labels,

        datasets: [{
          label: "Portfolio Value",
          data: values,
          borderRadius: 10
        }]
      },

      options: {
        plugins: {
          legend: {
            labels: {
              color: "white"
            }
          }
        },

        scales: {
          x: {
            ticks: {
              color: "white"
            }
          },

          y: {
            ticks: {
              color: "white"
            }
          }
        }
      }
    }
  );

  new Chart(
    document.getElementById("donutChart"),
    {
      type: "doughnut",

      data: {
        labels: labels,

        datasets: [{
          data: values
        }]
      },

      options: {
        plugins: {
          legend: {
            labels: {
              color: "white"
            }
          }
        }
      }
    }
  );
}

loadData();

</script>

</body>
</html>
