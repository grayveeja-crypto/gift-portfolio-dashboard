<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Gift Portfolio Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #16213e, #0f172a);
      color: white;
      min-height: 100vh;
      padding: 30px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .title {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .top-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }

    .small-title {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .big-number {
      font-size: 32px;
      font-weight: bold;
    }

    .green {
      color: #22c55e;
    }

    .red {
      color: #fb7185;
    }

    .middle-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    canvas {
      width: 100% !important;
      height: 320px !important;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 15px;
      color: #94a3b8;
      font-size: 14px;
    }

    td {
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .allocation {
      margin-top: 15px;
      font-size: 15px;
      color: #cbd5e1;
    }

    .footer {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    @media(max-width: 1000px) {

      .top-grid {
        grid-template-columns: 1fr 1fr;
      }

      .middle-grid {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width: 700px) {

      .top-grid {
        grid-template-columns: 1fr;
      }

      body {
        padding: 15px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <div class="title">
    Gift Portfolio Dashboard
  </div>

  <div class="top-grid">

    <div class="card">
      <div class="small-title">
        Total Portfolio
      </div>

      <div class="big-number" id="totalPortfolio">
        Loading...
      </div>
    </div>

    <div class="card">
      <div class="small-title">
        Number of Funds
      </div>

      <div class="big-number" id="fundCount">
        -
      </div>
    </div>

    <div class="card">
      <div class="small-title">
        Largest Allocation
      </div>

      <div class="big-number" id="largestFund">
        -
      </div>
    </div>

    <div class="card">
      <div class="small-title">
        Last Updated
      </div>

      <div class="big-number" id="updatedTime">
        -
      </div>
    </div>

  </div>

  <div class="middle-grid">

    <div class="card">

      <div class="small-title">
        Portfolio Allocation
      </div>

      <canvas id="allocationChart"></canvas>

    </div>

    <div class="card">

      <div class="small-title">
        Asset Allocation
      </div>

      <canvas id="donutChart"></canvas>

    </div>

  </div>

  <div class="card">

    <div class="small-title">
      Holdings
    </div>

    <table>

      <thead>
        <tr>
          <th>Fund</th>
          <th>Units</th>
          <th>NAV</th>
          <th>Total Value</th>
          <th>Allocation</th>
        </tr>
      </thead>

      <tbody id="tableBody">
      </tbody>

    </table>

  </div>

  <div class="footer">
    Connected to Google Sheets
  </div>

</div>

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/11rbwXYqXhJrXG7oWQS3pl5fHiXXWtNpsxgN7TbIc6UQ/gviz/tq?tqx=out:json";

function baht(value) {

  return Number(value).toLocaleString(
    "en-US",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  ) + " THB";
}

async function loadData() {

  const res = await fetch(SHEET_URL);

  const text = await res.text();

  const json = JSON.parse(
    text.substring(
      text.indexOf("{"),
      text.lastIndexOf("}") + 1
    )
  );

  const rows = json.table.rows;

  let total = 0;

  let labels = [];
  let values = [];

  let tableHTML = "";

  let largestFund = "";
  let largestAllocation = 0;

  rows.forEach(r => {

    const fund = r.c[0]?.v || "";
    const units = r.c[1]?.v || 0;
    const nav = r.c[2]?.v || 0;
    const totalValue = r.c[3]?.v || 0;
    const allocation = r.c[4]?.f || "";

    total += totalValue;

    labels.push(fund);
    values.push(totalValue);

    const allocNumber =
      parseFloat(allocation.replace("%",""));

    if (allocNumber > largestAllocation) {

      largestAllocation = allocNumber;
      largestFund = fund;
    }

    tableHTML += `
      <tr>
        <td>${fund}</td>
        <td>${units.toLocaleString()}</td>
        <td>${nav}</td>
        <td class="green">${baht(totalValue)}</td>
        <td>${allocation}</td>
      </tr>
    `;
  });

  document.getElementById("tableBody").innerHTML =
    tableHTML;

  document.getElementById("totalPortfolio").innerHTML =
    baht(total);

  document.getElementById("fundCount").innerHTML =
    rows.length;

  document.getElementById("largestFund").innerHTML =
    largestFund;

  document.getElementById("updatedTime").innerHTML =
    new Date().toLocaleDateString();

  new Chart(
    document.getElementById("allocationChart"),
    {
      type: "bar",

      data: {
        labels: labels,

        datasets: [{
          label: "Portfolio Value",

          data: values,

          borderRadius: 12
        }]
      },

      options: {

        plugins: {
          legend: {
            display: false
          }
        },

        scales: {

          y: {
            ticks: {
              color: "white"
            },

            grid: {
              color: "rgba(255,255,255,0.08)"
            }
          },

          x: {
            ticks: {
              color: "white"
            },

            grid: {
              display: false
            }
          }
        }
      }
    }
  );

  new Chart(
    document.getElementById("donutChart"),
    {
      type: "doughnut",

      data: {

        labels: labels,

        datasets: [{
          data: values
        }]
      },

      options: {

        plugins: {

          legend: {
            labels: {
              color: "white"
            }
          }
        }
      }
    }
  );
}

loadData();

</script>

</body>
</html>
